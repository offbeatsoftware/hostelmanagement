name: Build installer

# Builds HostelManagement-Setup-<version>.exe and attaches it to the workflow run
# (Actions > Build installer > the run > Artifacts > HostelManagement-Setup).
on:
  push:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The installer always gets an empty database built from this very version's schema
      # (not the template stored in the repository, which may lag behind).
      - name: Install Microsoft Access Database Engine 2016 (x64)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          $process = Start-Process $installer -ArgumentList '/quiet' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Access Database Engine install failed with exit code $($process.ExitCode)" }

      - name: Create empty database
        shell: pwsh
        env:
          HOSTEL_TEMPLATE_OUT: ${{ github.workspace }}\HostelManagement\Database\HostelManagement.accdb
        run: |
          Remove-Item $env:HOSTEL_TEMPLATE_OUT -ErrorAction SilentlyContinue
          dotnet test HostelManagement.sln -c Release --filter "FullyQualifiedName~DatabaseTemplateExport"
          if (-not (Test-Path $env:HOSTEL_TEMPLATE_OUT)) { throw 'The empty database was not created.' }

      # Self-contained: .NET 8 is included, so the hostel PC needs nothing but the Access Database Engine.
      - name: Publish
        run: dotnet publish HostelManagement/HostelManagement.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Check the published files
        shell: pwsh
        run: |
          foreach ($file in 'publish\HostelManagement.exe', 'publish\Database\HostelManagement.accdb', 'publish\UserGuide.pdf') {
            if (-not (Test-Path $file)) { throw "$file is missing from the published files." }
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content HostelManagement/HostelManagement.csproj
          $version = ($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\HostelManagement.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer\Output

      - uses: actions/upload-artifact@v4
        with:
          name: HostelManagement-Setup
          path: installer/Output/*.exe
          retention-days: 30
