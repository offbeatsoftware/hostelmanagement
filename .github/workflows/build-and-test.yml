name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Microsoft Access Database Engine 2016 (x64)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          $process = Start-Process $installer -ArgumentList '/quiet' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Access Database Engine install failed with exit code $($process.ExitCode)" }

      - name: Diagnose database creation (temporary)
        shell: pwsh
        continue-on-error: true
        run: |
          $variants = @(
            'Provider=Microsoft.ACE.OLEDB.16.0;Data Source={0}',
            'Provider=Microsoft.ACE.OLEDB.16.0;Data Source={0};Persist Security Info=False',
            'Provider=Microsoft.ACE.OLEDB.16.0;Data Source={0};Jet OLEDB:Engine Type=6',
            'Provider=Microsoft.ACE.OLEDB.16.0;Data Source={0};Persist Security Info=False;Jet OLEDB:Engine Type=6',
            'Provider=Microsoft.ACE.OLEDB.12.0;Data Source={0}'
          )
          $i = 0
          foreach ($v in $variants) {
            $i++
            $file = Join-Path $env:RUNNER_TEMP "adox$i.accdb"
            try {
              $cat = New-Object -ComObject ADOX.Catalog
              $conn = $cat.Create(($v -f $file))
              $conn.Close()
              Write-Host "ADOX OK    : $v"
            } catch { Write-Host "ADOX FAIL  : $v :: $($_.Exception.Message)" }
          }
          try {
            $dao = New-Object -ComObject DAO.DBEngine.120
            $db = $dao.CreateDatabase((Join-Path $env:RUNNER_TEMP 'dao.accdb'), ';LANGID=0x0409;CP=1252;COUNTRY=0')
            $db.Close()
            Write-Host 'DAO OK'
          } catch { Write-Host "DAO FAIL :: $($_.Exception.Message)" }
          $b = New-Object System.Data.OleDb.OleDbConnectionStringBuilder
          $b.Provider = 'Microsoft.ACE.OLEDB.16.0'; $b.DataSource = 'C:\x\y.accdb'; $b.PersistSecurityInfo = $false
          Write-Host "Builder output: $($b.ConnectionString)"

      - name: Build
        run: dotnet build HostelManagement.sln -c Release

      - name: Test
        run: dotnet test HostelManagement.sln -c Release --no-build --logger "console;verbosity=normal"
