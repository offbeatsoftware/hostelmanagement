name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Microsoft Access Database Engine 2016 (x64)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $installer
          $process = Start-Process $installer -ArgumentList '/quiet' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Access Database Engine install failed with exit code $($process.ExitCode)" }

      - name: Build
        run: dotnet build HostelManagement.sln -c Release

      # Windows Error Reporting saves a full dump if the test host crashes (analysed below).
      - name: Enable crash dumps
        shell: pwsh
        run: |
          $dumps = "${{ runner.temp }}\dumps"
          New-Item -ItemType Directory $dumps -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\testhost.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Test
        run: dotnet test HostelManagement.sln -c Release --no-build --blame --logger "console;verbosity=normal" --diag "${{ runner.temp }}/diag/vstest.log"

      # If the test host crashes, show what it wrote just before (unhandled exceptions, stack traces).
      - name: Test host diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "${{ runner.temp }}/diag" | ForEach-Object {
            Write-Host "===== $($_.Name)"
            Select-String -Path $_.FullName -Pattern "exit code|ExitCode|exited|Unhandled|0xC0|StackOverflow|OutOfMemory" |
              Select-Object -Last 20 | ForEach-Object { $_.Line }
            Write-Host "----- last lines"
            Get-Content $_.FullName -Tail 25
          }

      - name: Crash dump stacks
        if: failure()
        shell: pwsh
        run: |
          $dumps = Get-ChildItem "${{ runner.temp }}\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { Write-Host "No crash dump was written."; exit 0 }
          dotnet tool install --global dotnet-dump | Out-Null
          foreach ($dump in $dumps) {
            Write-Host "===== $($dump.Name)"
            dotnet-dump analyze $dump.FullName -c "pe -nested" -c "clrthreads" -c "clrstack -all" -c "exit"
          }

      - name: Screenshots for visual check
        if: always()
        continue-on-error: true
        env:
          PRINT_SCREENSHOTS: '1'
        run: dotnet test HostelManagement.sln -c Release --no-build --filter "FullyQualifiedName~ScreenshotTests" --logger "console;verbosity=detailed"
